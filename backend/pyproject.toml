[project]
name = "mer-backend"
version = "0.1.0"
description = "移动环境监测机器人上位机 — API Gateway 与领域服务（M1 骨架）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.116",
  "uvicorn[standard]>=0.32.0,<0.33",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.6.0,<3",
  "pyyaml>=6.0.2,<7",
  "python-multipart>=0.0.12,<0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9",
  "httpx>=0.27.0,<0.29",
  "ruff>=0.7.0,<0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

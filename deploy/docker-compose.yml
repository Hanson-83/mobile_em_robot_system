services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MER_ENV: ${MER_ENV:-prod}
      MER_SECRET: ${MER_SECRET:?MER_SECRET is required}
      MER_ALLOW_DEV_AUTH: "false"
      MER_CONFIG_DIR: /app/config
    volumes:
      - ../config:/app/config:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

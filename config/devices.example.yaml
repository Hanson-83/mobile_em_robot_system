# config/devices.example.yaml
robots:
  - id: robot-01
    adapter: amr_fake
    endpoint: "http://192.168.0.10/api"
    # model: "<user-provided>"
instruments:
  - id: pc-01
    robot_id: robot-01
    adapter: particle_fake
    access_mode: direct
    options:
      protocol: modbus_tcp
      unit_id: 1
  - id: th-01
    robot_id: robot-01
    adapter: climate_fake
    access_mode: direct
    options:
      protocol: modbus_tcp
      unit_id: 2
  - id: af-01
    robot_id: robot-01
    adapter: airflow_fake
    access_mode: direct
    options:
      protocol: modbus_tcp
      unit_id: 3
elevators:
  - id: elev-01
    adapter: elevator_fake
    endpoint: "http://192.168.0.20/api"
    floors: [1, 2, 3]
    # model: "<user-provided>"
features:
  audit_trail: false
  e_sign: false
  elevator_skills: true
  resource_mutex: simple
  on_conflict: queue
  session_on_disconnect: reconnect
  reconnect_attempts: 3
  realtime_channel: websocket
